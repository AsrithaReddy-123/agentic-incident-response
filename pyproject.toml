[project]
name = "agentic-incident-response"
version = "0.1.0"
description = "Agentic incident response with streaming ingestion, retrieval, and evidence-checked remediation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.3",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "kafka-python>=2.0",
  "elasticsearch>=8.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
